events {
  worker_connections 1024;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  sendfile   on;
  tcp_nopush on;

  # Hide nginx version from Server header and error pages
  server_tokens off;

  server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Main page — return 404 for unknown paths, not a fallback to index.html
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
      try_files $uri $uri/ =404;
    }

    # Liveness/readiness probe endpoint
    location /health {
      access_log  off;
      default_type text/plain;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
      return 200 "healthy\n";
    }

    # Structured version JSON — served as a static file generated at startup
    location /version {
      access_log off;
      default_type application/json;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
      try_files /version.json =404;
    }
  }
}
