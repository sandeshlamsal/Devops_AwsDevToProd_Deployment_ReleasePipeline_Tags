name: Terraform — QA

# ── Trigger ───────────────────────────────────────────────────────────────────
# PRs:        fmt + validate + checkov
# Push main:  plan → apply (OIDC role, QA account, requires manual approval)
on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan = dry run only | apply = plan + apply (requires approval)"
        required: true
        default: apply
        type: choice
        options: [plan, apply]

  push:
    branches: [main]
    paths:
      - "terraform/qa/**"
      - "terraform/modules/**"
  pull_request:
    branches: [main]
    paths:
      - "terraform/qa/**"
      - "terraform/modules/**"

env:
  TF_DIR:     terraform/qa
  AWS_REGION: us-east-1
  TF_VERSION: "~1.6"

permissions:
  contents:      read
  id-token:      write
  pull-requests: write

jobs:
  lint-and-scan:
    name: Fmt · Validate · Security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform -chdir=${{ env.TF_DIR }} fmt -check -recursive

      - name: Terraform init (local only)
        run: terraform -chdir=${{ env.TF_DIR }} init -backend=false

      - name: Terraform validate
        run: terraform -chdir=${{ env.TF_DIR }} validate

      - name: Checkov — IaC security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory:        ${{ env.TF_DIR }}
          framework:        terraform
          soft_fail:        false
          output_format:    github_failed_only
          download_external_modules: true

      - name: Post PR lint summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Terraform QA — lint passed\nfmt ✅  validate ✅  checkov ✅\n\nMerge to `main` to trigger `plan → apply` (requires QA-terraform approval).'
            });

  # ─── Requires manual approval via GitHub Environment "qa-terraform" ────────
  plan-and-apply:
    name: Plan & Apply → QA
    needs: lint-and-scan
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: qa-terraform     # configure Required reviewers in GitHub Settings

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC — QA account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.QA_IAM_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_DIR }} init

      - name: Terraform plan
        run: |
          terraform -chdir=${{ env.TF_DIR }} plan \
            -no-color \
            -out=tfplan \
            | tee plan-output.txt

      - name: Terraform apply
        run: terraform -chdir=${{ env.TF_DIR }} apply -auto-approve tfplan

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-qa-${{ github.sha }}
          path: ${{ env.TF_DIR }}/plan-output.txt
          retention-days: 30
