name: Terraform — DEV

# ── Trigger ───────────────────────────────────────────────────────────────────
# PRs:           lint + validate + checkov  (no AWS access)
# Push to main:  plan → [approval gate] → apply
# workflow_dispatch:
#   action=plan  → plan only (stop before approval gate)
#   action=apply → plan → [approval gate] → apply
on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan = show changes only | apply = plan then request approval to apply"
        required: true
        default: apply
        type: choice
        options: [plan, apply]

  push:
    branches: [main]
    paths:
      - "terraform/dev/**"
      - "terraform/modules/**"
  pull_request:
    branches: [main]
    paths:
      - "terraform/dev/**"
      - "terraform/modules/**"

env:
  TF_DIR:     terraform/dev
  AWS_REGION: us-east-1
  TF_VERSION: "~1.6"

permissions:
  contents:      read
  id-token:      write        # OIDC
  pull-requests: write        # post plan comment on PRs

jobs:
  # ─── Job 1: Static checks — no AWS credentials needed ─────────────────────
  lint-and-scan:
    name: Fmt · Validate · Checkov
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform -chdir=${{ env.TF_DIR }} fmt -check -recursive

      - name: Terraform init (local — no backend)
        run: terraform -chdir=${{ env.TF_DIR }} init -backend=false

      - name: Terraform validate
        run: terraform -chdir=${{ env.TF_DIR }} validate

      - name: Checkov — IaC security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory:        ${{ env.TF_DIR }}
          framework:        terraform
          soft_fail:        false
          output_format:    github_failed_only
          download_external_modules: true

  # ─── Job 2: Terraform plan — runs on push to main or workflow_dispatch ─────
  plan:
    name: Terraform plan — DEV
    needs: lint-and-scan
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC — DEV account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_IAM_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_DIR }} init

      - name: Terraform plan
        id: plan
        run: |
          terraform -chdir=${{ env.TF_DIR }} plan \
            -no-color \
            -out=tfplan \
            2>&1 | tee ${{ env.TF_DIR }}/plan-output.txt

      - name: Write plan to job summary
        run: |
          echo "## Terraform Plan — DEV" >> "$GITHUB_STEP_SUMMARY"
          echo ""                         >> "$GITHUB_STEP_SUMMARY"
          echo '```terraform'             >> "$GITHUB_STEP_SUMMARY"
          cat ${{ env.TF_DIR }}/plan-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```'                      >> "$GITHUB_STEP_SUMMARY"
          echo ""                         >> "$GITHUB_STEP_SUMMARY"
          echo "> Review the plan above, then approve the **Terraform apply — DEV** job to apply." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev-${{ github.run_id }}
          path: |
            ${{ env.TF_DIR }}/tfplan
            ${{ env.TF_DIR }}/plan-output.txt
          retention-days: 7     # plan artifacts expire — must apply within 7 days

  # ─── Job 3: Approval gate then apply ──────────────────────────────────────
  # GitHub pauses here and sends a notification to reviewers configured on
  # the "dev-terraform" Environment (Settings → Environments → dev-terraform).
  # Reviewer reads the plan from Job 2's summary, then clicks Approve.
  apply:
    name: Terraform apply — DEV
    needs: plan
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: dev-terraform    # ← configure Required reviewers here

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC — DEV account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_IAM_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Download approved plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev-${{ github.run_id }}
          path: ${{ env.TF_DIR }}

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_DIR }} init

      - name: Terraform apply (approved plan only — no re-plan)
        run: terraform -chdir=${{ env.TF_DIR }} apply -auto-approve tfplan

      - name: Apply summary
        run: |
          echo "### DEV infrastructure applied" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA**: \`${{ github.sha }}\`"           >> "$GITHUB_STEP_SUMMARY"
          echo "- **Approved by**: ${{ github.actor }}"     >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            >> "$GITHUB_STEP_SUMMARY"
