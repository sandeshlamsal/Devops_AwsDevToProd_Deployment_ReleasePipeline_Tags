name: Cluster — Pause / Resume

# One-click scale EKS node groups to 0 (pause) or 1 (resume).
# Saves ~80% of daily compute cost when clusters are idle.
#
# Cost impact (us-east-1, spot t3.small):
#   Pause  → stops EC2 nodes; control plane still runs ($0.10/hr each)
#   Resume → nodes back in ~2 min; next deploy works normally
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which cluster(s) to scale"
        required: true
        type: choice
        options: [dev, qa, both]
      action:
        description: "Pause (scale to 0) or Resume (scale to 1)"
        required: true
        type: choice
        options: [pause, resume]

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  # ── DEV ──────────────────────────────────────────────────────────────────────
  scale-dev:
    name: "${{ inputs.action }} — dev"
    if: inputs.environment == 'dev' || inputs.environment == 'both'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC — DEV)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_IAM_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Scale eks-dev-spot (${{ inputs.action }})
        run: |
          if [[ "${{ inputs.action }}" == "pause" ]]; then
            DESIRED=0; MIN=0
          else
            DESIRED=1; MIN=1
          fi

          aws eks update-nodegroup-config \
            --cluster-name   eks-dev \
            --nodegroup-name eks-dev-spot \
            --scaling-config minSize=${MIN},maxSize=3,desiredSize=${DESIRED} \
            --region ${{ env.AWS_REGION }}

          echo "Waiting for node group to become active..."
          aws eks wait nodegroup-active \
            --cluster-name   eks-dev \
            --nodegroup-name eks-dev-spot \
            --region         ${{ env.AWS_REGION }}

          echo "### eks-dev — ${{ inputs.action }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Desired nodes: ${DESIRED}" >> "$GITHUB_STEP_SUMMARY"
          [[ "${{ inputs.action }}" == "pause" ]] && \
            echo "> Control plane still runs at \$0.10/hr. Use teardown-dev for zero cost." >> "$GITHUB_STEP_SUMMARY" || true

  # ── QA ───────────────────────────────────────────────────────────────────────
  scale-qa:
    name: "${{ inputs.action }} — qa"
    if: inputs.environment == 'qa' || inputs.environment == 'both'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC — QA)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.QA_IAM_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Scale eks-qa-spot (${{ inputs.action }})
        run: |
          if [[ "${{ inputs.action }}" == "pause" ]]; then
            DESIRED=0; MIN=0
          else
            DESIRED=1; MIN=1
          fi

          aws eks update-nodegroup-config \
            --cluster-name   eks-qa \
            --nodegroup-name eks-qa-spot \
            --scaling-config minSize=${MIN},maxSize=3,desiredSize=${DESIRED} \
            --region ${{ env.AWS_REGION }}

          echo "Waiting for node group to become active..."
          aws eks wait nodegroup-active \
            --cluster-name   eks-qa \
            --nodegroup-name eks-qa-spot \
            --region         ${{ env.AWS_REGION }}

          echo "### eks-qa — ${{ inputs.action }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Desired nodes: ${DESIRED}" >> "$GITHUB_STEP_SUMMARY"
          [[ "${{ inputs.action }}" == "pause" ]] && \
            echo "> Control plane still runs at \$0.10/hr." >> "$GITHUB_STEP_SUMMARY" || true
