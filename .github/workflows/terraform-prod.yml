name: Terraform — PROD

# ── Trigger ───────────────────────────────────────────────────────────────────
# PRs:        fmt + validate + checkov
# Push main:  plan → apply (OIDC role, PROD account, requires manual approval)
#
# PROD apply is doubly gated:
#   1. GitHub Environment "prod-terraform" — requires named reviewers
#   2. OIDC role trust — only main branch can assume it
on:
  push:
    branches: [main]
    paths:
      - "terraform/prod/**"
      - "terraform/modules/**"
  pull_request:
    branches: [main]
    paths:
      - "terraform/prod/**"
      - "terraform/modules/**"

env:
  TF_DIR:     terraform/prod
  AWS_REGION: us-east-1
  TF_VERSION: "~1.6"

permissions:
  contents:      read
  id-token:      write
  pull-requests: write

jobs:
  lint-and-scan:
    name: Fmt · Validate · Security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform -chdir=${{ env.TF_DIR }} fmt -check -recursive

      - name: Terraform init (local only)
        run: terraform -chdir=${{ env.TF_DIR }} init -backend=false

      - name: Terraform validate
        run: terraform -chdir=${{ env.TF_DIR }} validate

      - name: Checkov — IaC security scan (PROD — hard fail)
        uses: bridgecrewio/checkov-action@master
        with:
          directory:        ${{ env.TF_DIR }}
          framework:        terraform
          soft_fail:        false
          output_format:    github_failed_only
          download_external_modules: true

      - name: Post PR lint summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Terraform PROD — lint passed\nfmt ✅  validate ✅  checkov ✅\n\n> **Merge to `main` will trigger `plan → apply` against the PROD account.**\n> This requires approval from a named reviewer in the `prod-terraform` environment.'
            });

  # ─── Plan only (no apply) — output shown in Actions summary ────────────────
  plan:
    name: Terraform plan (PROD preview)
    needs: lint-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC — PROD account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_IAM_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_DIR }} init

      - name: Terraform plan
        id: plan
        run: |
          terraform -chdir=${{ env.TF_DIR }} plan \
            -no-color \
            -out=tfplan \
            | tee plan-output.txt

      - name: Write plan to job summary
        run: |
          echo "## Terraform Plan — PROD" >> "$GITHUB_STEP_SUMMARY"
          echo '```terraform'              >> "$GITHUB_STEP_SUMMARY"
          cat plan-output.txt             >> "$GITHUB_STEP_SUMMARY"
          echo '```'                      >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod-${{ github.sha }}
          path: |
            ${{ env.TF_DIR }}/tfplan
            ${{ env.TF_DIR }}/plan-output.txt
          retention-days: 30

  # ─── Apply — requires human approval via "prod-terraform" environment ──────
  apply:
    name: Apply → PROD (approval required)
    needs: plan
    runs-on: ubuntu-latest
    environment: prod-terraform    # ← Set Required reviewers here in GitHub Settings

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC — PROD account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_IAM_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Download approved plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod-${{ github.sha }}
          path: ${{ env.TF_DIR }}

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_DIR }} init

      - name: Terraform apply (approved plan)
        run: terraform -chdir=${{ env.TF_DIR }} apply -auto-approve tfplan

      - name: Apply summary
        run: |
          echo "### PROD infrastructure updated" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA**: \`${{ github.sha }}\`"  >> "$GITHUB_STEP_SUMMARY"
          echo "- **Approved by**: ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
