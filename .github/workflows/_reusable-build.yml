name: Reusable — Build, Trivy scan & push to GHCR

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
        description: "Full image tag to push (e.g. dev_abc1234_v42)"
      env_name:
        required: true
        type: string
        description: "Environment name injected into the image"
    outputs:
      image_ref:
        description: "Full image reference pushed (registry/repo:tag)"
        value: ${{ jobs.build.outputs.image_ref }}
      trivy_passed:
        description: "true if Trivy found no CRITICAL vulnerabilities"
        value: ${{ jobs.build.outputs.trivy_passed }}

permissions:
  contents: read
  packages: write        # push to GHCR
  security-events: write # upload SARIF to GitHub Security tab

jobs:
  build:
    name: Build & scan
    runs-on: ubuntu-latest
    outputs:
      image_ref:    ${{ steps.meta.outputs.image_ref }}
      trivy_passed: ${{ steps.trivy.outputs.passed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REF="ghcr.io/${REPO}/nginx-release:${{ inputs.image_tag }}"
          SHA_REF="ghcr.io/${REPO}/nginx-release:${{ inputs.env_name }}_${{ github.sha }}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "sha_ref=${SHA_REF}"     >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context:   ./nginx
          push:      false          # scan before pushing
          load:      true           # load into local daemon for Trivy
          tags:      ${{ steps.meta.outputs.image_ref }}
          build-args: |
            APP_VERSION=${{ inputs.image_tag }}
            BUILD_SHA=${{ github.sha }}
            ENV_NAME=${{ inputs.env_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || '' }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Container image vulnerability scan ────────────────────────────────────
      - name: Trivy — image scan (CRITICAL + HIGH)
        id: trivy-scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:    ${{ steps.meta.outputs.image_ref }}
          format:       sarif
          output:       trivy-results.sarif
          severity:     CRITICAL,HIGH
          exit-code:    "1"         # fail build on findings
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Mark Trivy passed
        id: trivy
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

      # ── Push (only reaches here if Trivy passed) ──────────────────────────────
      - name: Push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push:    true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.sha_ref }}
          build-args: |
            APP_VERSION=${{ inputs.image_tag }}
            BUILD_SHA=${{ github.sha }}
            ENV_NAME=${{ inputs.env_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || '' }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.image_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
