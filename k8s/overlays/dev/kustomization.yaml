apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

# Image tag is set dynamically by the pipeline:
#   kustomize edit set image ghcr.io/ORG/nginx-release:dev_<sha>_v<N>
images:
  - name: ghcr.io/PLACEHOLDER/nginx-release
    newTag: dev_latest

patches:
  - path: patch-replicas.yaml
    target:
      kind: Deployment
      name: nginx-release
