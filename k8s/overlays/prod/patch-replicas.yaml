apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-release
  namespace: release-app
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: nginx
          resources:
            requests:
              memory: "128Mi"
              cpu:    "100m"
            limits:
              memory: "256Mi"
              cpu:    "250m"
