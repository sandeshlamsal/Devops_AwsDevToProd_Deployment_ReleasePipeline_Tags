apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-release
  namespace: release-app
  labels:
    app: nginx-release
spec:
  replicas: 1          # overridden per overlay
  selector:
    matchLabels:
      app: nginx-release
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:       1
      maxUnavailable: 0   # zero-downtime rollout
  template:
    metadata:
      labels:
        app: nginx-release
      annotations:
        # Forces pod restart when configmap changes
        configmap-version: "v1"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: nginx
          # image tag is overwritten by kustomize edit set image
          image: ghcr.io/PLACEHOLDER/nginx-release:latest
          ports:
            - containerPort: 80
              protocol: TCP

          # Env vars come from ConfigMap — entrypoint.sh uses these to render HTML
          envFrom:
            - configMapRef:
                name: nginx-release-config

          resources:
            requests:
              memory: "64Mi"
              cpu:    "50m"
            limits:
              memory: "128Mi"
              cpu:    "150m"

          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds:       30
            timeoutSeconds:      5
            failureThreshold:    3

          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds:       10
            timeoutSeconds:      3
            failureThreshold:    2

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   false   # nginx writes to /var/cache/nginx
            runAsNonRoot:             false    # nginx needs root for port 80 binding

      securityContext:
        fsGroup: 101   # nginx group
