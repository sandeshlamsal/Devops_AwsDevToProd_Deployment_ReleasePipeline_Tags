apiVersion: v1
kind: Service
metadata:
  name: nginx-release
  namespace: release-app
  labels:
    app: nginx-release
spec:
  type: LoadBalancer          # Creates an AWS NLB; change to ClusterIP if using Ingress
  selector:
    app: nginx-release
  ports:
    - name:       http
      protocol:   TCP
      port:       80
      targetPort: 80
  # Annotation for AWS Load Balancer Controller (NLB)
  # Uncomment if you install aws-load-balancer-controller:
  # annotations:
  #   service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  #   service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
